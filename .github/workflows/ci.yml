name: PaeCal CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: "npm"

      - name: Install dependencies
        run: npm ci || npm install

      - name: Run import checks
        run: node src/check-imports.js

      - name: Run preset flow tests
        run: node scripts/test-preset-flow.js

      - name: Run full check script
        run: npm run check
